# Gestor de continguts de SOM ELS QUE SOM
# Repositori de GitHub: somelsquesom/somelsquesom
backend:
  name: github
  repo: somelsquesom/somelsquesom
  branch: main
  # Quan tingueu l'autenticador de Sveltia a Cloudflare Workers, descomenteu i poseu-ne l'adreça:
  # base_url: https://sveltia-cms-auth.EL-VOSTRE-COMPTE.workers.dev

locale: ca
site_url: https://somelsquesom.pages.dev
media_folder: public/uploads
public_folder: /uploads

collections:
  # ---------------- OBRES ----------------
  - name: obres
    label: Obres
    label_singular: Obra
    description: Totes les obres. Marqueu «En gira» les que es poden contractar ara.
    folder: src/content/obres
    create: true
    identifier_field: titol
    slug: "{{slug}}"
    summary: "{{titol}} · {{temporada}} · {{estat}}"
    sortable_fields: [estrena, titol]
    fields:
      - { name: titol, label: Títol, widget: string }
      - name: estat
        label: Estat
        widget: select
        default: arxiu
        options:
          - { label: "En gira (es pot contractar)", value: en-gira }
          - { label: "Arxiu (temporades anteriors)", value: arxiu }
      - { name: secundaria, label: "Obra secundària (a «Temporades anteriors» surt només a la llista «També vam fer», sense fitxa gran)", widget: boolean, default: false, required: false }
      - name: grup
        label: Qui la fa
        widget: select
        default: Companyia
        options: [Companyia, Companyia Jove, Companyia Jove 2.0, Taller de teatre]
      - { name: temporada, label: "Any o temporada (agrupa l'arxiu, p. ex. 2024)", widget: string }
      - { name: estrena, label: "Data d'estrena", widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: estrenaText, label: "Estrena en text (opcional, si la data no és exacta: «Nadal del 2012»)", widget: string, required: false }
      - name: etiquetes
        label: Etiquetes
        hint: "Escriu-les separades per comes: Comèdia, Nadal, Familiar, Musical..."
        widget: list
        required: false
      - { name: textPropi, label: "L'hem escrit o reescrit nosaltres", widget: boolean, default: false, required: false }
      - { name: resum, label: "Resum d'una o dues línies", widget: text, required: false }
      - { name: body, label: "Sinopsi i text llarg", widget: markdown, required: false }
      - { name: autoria, label: Autoria, widget: string, required: false }
      - { name: direccio, label: Direcció, widget: string, required: false }
      - { name: durada, label: "Durada (p. ex. 75 min)", widget: string, required: false }
      - { name: public, label: Públic, widget: string, required: false }
      - { name: format, label: "Format (sala, carrer...)", widget: string, required: false }
      - { name: foto, label: Foto principal, widget: image, required: false }
      - { name: galeria, label: "Galeria de fotos (a la fitxa en surten les 10 primeres; la resta, a la pàgina de galeria)", widget: image, multiple: true, required: false }
      - name: seccionsGaleria
        label: "Més galeries per seccions (p. ex. una per a cada lloc on l'hem fet)"
        label_singular: secció
        widget: list
        required: false
        summary: "{{titol}}"
        fields:
          - { name: titol, label: "Títol de la secció (p. ex. Funció a Castell d'Aro)", widget: string }
          - { name: fotos, label: Fotos, widget: image, multiple: true }
      - { name: trailer, label: "Tràiler (enllaç de YouTube o Vimeo)", widget: string, required: false }
      - name: videos
        label: "Vídeos (reels d'Instagram, TikTok, YouTube...)"
        label_singular: vídeo
        widget: list
        required: false
        summary: "{{titol}}"
        fields:
          - { name: titol, label: Títol, widget: string, required: false }
          - { name: enllac, label: "Enllaç al vídeo", widget: string }
          - { name: imatge, label: "Imatge de portada", widget: image, required: false }
      - { name: entrades, label: "Comprar entrades: enllaç (si és buit, el botó no surt)", widget: string, required: false }
      - { name: entradesInfo, label: "Entrades: text informatiu (p. ex. «Entrades disponibles a partir del 5 de desembre a les 10 h · 8 €»)", widget: string, required: false }
      - { name: dossier, label: Dossier de venda (PDF), widget: file, required: false }
      - { name: rider, label: Rider tècnic (PDF), widget: file, required: false }
      - { name: cartell, label: Cartell, widget: image, required: false }
      - { name: flyer, label: Flyer, widget: image, required: false }
      - { name: fotosPremsa, label: Fotos de premsa (ZIP), widget: file, required: false }
      - name: fitxaArtistica
        label: Fitxa artística
        label_singular: persona
        widget: list
        required: false
        summary: "{{rol}} · {{nom}}"
        fields:
          - { name: rol, label: "Rol o personatge", widget: string }
          - { name: nom, label: Nom, widget: string }
      - name: fitxaTecnica
        label: Fitxa tècnica
        label_singular: dada
        widget: list
        required: false
        summary: "{{concepte}}: {{valor}}"
        fields:
          - { name: concepte, label: "Concepte (espai, muntatge, llum...)", widget: string }
          - { name: valor, label: Valor, widget: string }
      - { name: representacions, label: "Nombre de representacions (si és buit, es compten les funcions)", widget: number, value_type: int, required: false }
      - { name: llocs, label: "On l'hem fet (resum en text)", widget: string, required: false }
      - { name: poblacions, label: "Poblacions on l'hem fet", widget: list, required: false }
      - name: funcions
        label: Funcions i bolos (amb data)
        label_singular: funció
        widget: list
        required: false
        summary: "{{data}} · {{espai}} · {{poblacio}}"
        fields:
          - { name: data, label: "Data (p. ex. 18.01.2014)", widget: string }
          - { name: espai, label: Espai o sala, widget: string, required: false }
          - { name: poblacio, label: Població, widget: string, required: false }
          - { name: nota, label: Nota, widget: string, required: false }
          - { name: entrades, label: "Enllaç d'entrades d'aquesta funció", widget: string, required: false }
          - { name: adreca, label: "Adreça per al mapa (opcional: si és buida, es busca l'espai i la població)", widget: string, required: false }
      - name: cites
        label: Què n'han dit
        label_singular: cita
        widget: list
        required: false
        fields:
          - { name: text, label: Cita, widget: text }
          - { name: autor, label: "Qui ho diu", widget: string }
      - { name: destacada, label: Destacada a l'inici, widget: boolean, default: false, required: false }

  # ---------------- NOTÍCIES ----------------
  - name: noticies
    label: Notícies
    label_singular: Notícia
    description: Notícies i activitats (conta contes, extraescolars, sortides...).
    folder: src/content/noticies
    create: true
    identifier_field: titol
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{data}} · {{titol}}"
    sortable_fields: [data, titol]
    fields:
      - { name: titol, label: Títol, widget: string }
      - { name: data, label: Data, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: entradeta, label: Entradeta, widget: text, required: false }
      - { name: foto, label: Foto principal, widget: image, required: false }
      - { name: peuFoto, label: Peu de foto, widget: string, required: false }
      - { name: body, label: Text, widget: markdown }
      - { name: galeria, label: Més fotos, widget: image, multiple: true, required: false }
      - name: videos
        label: "Vídeos (reels d'Instagram, TikTok, YouTube...)"
        label_singular: vídeo
        widget: list
        required: false
        summary: "{{titol}}"
        fields:
          - { name: titol, label: Títol, widget: string, required: false }
          - { name: enllac, label: "Enllaç al vídeo", widget: string }
          - { name: imatge, label: "Imatge de portada", widget: image, required: false }
      - { name: destacada, label: Destacada, widget: boolean, default: false, required: false }

  # ---------------- PREMSA ----------------
  - name: premsa
    label: Premsa
    label_singular: Aparició a la premsa
    description: Articles, entrevistes, ràdio i tele on hem sortit.
    folder: src/content/premsa
    create: true
    identifier_field: titol
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{data}} · {{mitja}} · {{titol}}"
    fields:
      - { name: titol, label: "Títol de l'article o programa", widget: string }
      - { name: mitja, label: Mitjà, widget: string }
      - { name: data, label: Data, widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD" }
      - { name: dataText, label: "Data en text (opcional, si no és exacta)", widget: string, required: false }
      - { name: tipus, label: Tipus, widget: select, options: [Article, Entrevista, Àudio, Vídeo], default: Article }
      - { name: enllac, label: Enllaç, widget: string, required: false }
      - { name: body, label: Notes (no es mostren), widget: text, required: false }

  # ---------------- PÀGINES I TEXTOS ----------------
  - name: pagines
    label: Pàgines
    label_singular: Pàgina
    description: Pàgines noves (p. ex. «Escola de teatre»). L'adreça serà /nom-de-la-pagina; per posar-la al menú, afegeix-la a «Textos i aparença → Menú».
    folder: src/content/pagines
    create: true
    identifier_field: titol
    slug: '{{slug}}'
    summary: '{{titol}}'
    fields:
    - name: titol
      label: Títol (també fa l'adreça)
      widget: string
    - name: titolGran
      label: Títol gran (opcional, admet *cursiva*)
      widget: string
      required: false
    - name: etiqueta
      label: Etiqueta petita
      widget: string
      required: false
    - name: entradeta
      label: Entradeta
      widget: text
      required: false
    - name: foto
      label: Foto principal
      widget: image
      required: false
    - name: body
      label: Text
      widget: markdown
      required: false
    - name: galeria
      label: Galeria de fotos
      widget: image
      multiple: true
      required: false
    - name: boto
      label: Botó final
      widget: object
      required: false
      fields:
      - name: text
        label: Text
        widget: string
        required: false
      - name: enllac
        label: Enllaç
        widget: string
        required: false
    - name: esborrany
      label: Esborrany (no surt a la web)
      widget: boolean
      default: false
      required: false
  - name: textos
    label: Textos i aparença
    description: 'Tots els textos fixos de la web, el menú, l''ordre de la portada i els colors. Truc: *paraula* surt en cursiva granat; {nom}, {poblacio}, {anyInici}, {obres}, {representacions}, {email}
      i {titol} es canvien pel valor real.'
    files:
    - name: menu
      label: Menú
      file: src/data/textos/menu.json
      format: json
      fields:
      - name: elements
        label: Apartats del menú (arrossega per canviar l'ordre)
        label_singular: apartat
        widget: list
        summary: '{{text}} → {{enllac}}'
        hint: L'enllaç pot ser una pàgina de la web (/companyia, /en-gira, /arxiu, /noticies, /contractacio o una pàgina creada a «Pàgines», p. ex. /escola) o una adreça externa (https://...).
        fields:
        - name: text
          label: Text
          widget: string
        - name: enllac
          label: Enllaç
          widget: string
      - name: boto
        label: Botó destacat de la dreta
        widget: object
        fields:
        - name: text
          label: Text (buit = no surt)
          widget: string
          required: false
        - name: enllac
          label: Enllaç
          widget: string
          required: false
    - name: estil
      label: Colors i aparença
      file: src/data/textos/estil.json
      format: json
      fields:
      - name: colorDestacat
        label: Color destacat (granat)
        widget: color
      - name: colorDestacatFosc
        label: Color destacat fosc (quan passes el ratolí)
        widget: color
      - name: colorText
        label: Color del text
        widget: color
      - name: colorFons
        label: Color de fons
        widget: color
      - name: colorFonsSuau
        label: Color de fons suau (franges grises)
        widget: color
      - name: franjaSuperior
        label: Franja de color a dalt de tot
        widget: boolean
        required: false
      - name: formatFotos
        label: "Format de les fotos de portada (inici, En gira, arxiu, notícies). Si una foto té un altre format, es retalla sola pel centre. Els cartells sempre surten sencers."
        widget: select
        default: "4/5"
        options:
          - { label: "Vertical (4:5)", value: "4/5" }
          - { label: "Quadrada (1:1)", value: "1/1" }
          - { label: "Clàssica (4:3)", value: "4/3" }
          - { label: "Foto (3:2)", value: "3/2" }
          - { label: "Panoràmica (16:9)", value: "16/9" }
    - name: inici
      label: Pàgina d'inici
      file: src/data/textos/inici.json
      format: json
      fields:
      - name: titol
        label: Títol gran
        required: false
        widget: text
      - name: presentacio
        label: Text d'introducció
        required: false
        widget: text
      - name: boto1
        label: Botó 1
        required: false
        widget: object
        fields:
        - name: text
          label: Text
          required: false
          widget: text
        - name: enllac
          label: Enllaç
          required: false
          widget: string
      - name: boto2
        label: Botó 2
        required: false
        widget: object
        fields:
        - name: text
          label: Text
          required: false
          widget: text
        - name: enllac
          label: Enllaç
          required: false
          widget: string
      - name: numerarSeccions
        label: Numerar les seccions (01 —, 02 —...)
        widget: boolean
        required: false
      - name: seccions
        label: Seccions de la portada (arrossega per canviar l'ordre)
        label_singular: secció
        widget: list
        summary: '{{seccio}} · visible: {{visible}}'
        fields:
        - name: seccio
          label: Secció
          widget: select
          options:
          - label: Obres en gira
            value: en-gira
          - label: La companyia
            value: companyia
          - label: Temporades anteriors
            value: arxiu
          - label: Notícies
            value: noticies
          - label: Contractació
            value: contractacio
        - name: visible
          label: Visible
          widget: boolean
          default: true
      - name: enGira
        label: Secció / etiqueta «En gira»
        required: false
        widget: object
        fields:
        - name: etiqueta
          label: Etiqueta petita (a sobre del títol)
          required: false
          widget: string
        - name: enllac
          label: Enllaç
          required: false
          widget: string
        - name: disponible
          label: Text «Disponible»
          required: false
          widget: string
        - name: mesInfo
          label: Text de l'enllaç de cada obra
          required: false
          widget: string
        - name: quantes
          label: Quantes se'n mostren
          required: false
          widget: number
          value_type: int
      - name: companyia
        label: Secció «La companyia»
        required: false
        widget: object
        fields:
        - name: etiqueta
          label: Etiqueta petita (a sobre del títol)
          required: false
          widget: string
        - name: titol
          label: Títol gran
          required: false
          widget: text
        - name: text
          label: Text
          required: false
          widget: text
        - name: enllac
          label: Enllaç
          required: false
          widget: string
      - name: arxiu
        label: Secció «Temporades anteriors»
        required: false
        widget: object
        fields:
        - name: etiqueta
          label: Etiqueta petita (a sobre del títol)
          required: false
          widget: string
        - name: enllac
          label: Enllaç
          required: false
          widget: string
        - name: quantes
          label: Quantes se'n mostren
          required: false
          widget: number
          value_type: int
      - name: noticies
        label: Secció «Notícies»
        required: false
        widget: object
        fields:
        - name: etiqueta
          label: Etiqueta petita (a sobre del títol)
          required: false
          widget: string
        - name: enllac
          label: Enllaç
          required: false
          widget: string
        - name: quantes
          label: Quantes se'n mostren
          required: false
          widget: number
          value_type: int
      - name: contractacio
        label: Secció «Contractació»
        required: false
        widget: object
        fields:
        - name: etiqueta
          label: Etiqueta petita (a sobre del títol)
          required: false
          widget: string
        - name: titol
          label: Títol gran
          required: false
          widget: string
        - name: boto
          label: Botó
          required: false
          widget: string
    - name: companyia
      label: Pàgina «La companyia»
      file: src/data/textos/companyia.json
      format: json
      fields:
      - name: titolPestanya
        label: Nom a la pestanya del navegador
        required: false
        widget: string
      - name: etiqueta
        label: Etiqueta petita (a sobre del títol)
        required: false
        widget: string
      - name: titol
        label: Títol gran
        required: false
        widget: string
      - name: presentacio
        label: Text d'introducció
        required: false
        widget: text
      - name: mostrarXifres
        label: Mostrar les xifres
        required: false
        widget: boolean
      - name: xifres
        label: Noms de les xifres
        required: false
        widget: object
        fields:
        - name: anys
          label: 'Xifra: anys'
          required: false
          widget: string
        - name: obres
          label: 'Xifra: obres'
          required: false
          widget: string
        - name: representacions
          label: Paraula «representacions»
          required: false
          widget: string
        - name: poblacions
          label: 'Xifra: poblacions'
          required: false
          widget: string
      - name: mostrarHistoria
        label: Mostrar la història
        required: false
        widget: boolean
      - name: historiaEtiqueta
        label: 'Història: etiqueta'
        required: false
        widget: string
      - name: historiaTitol
        label: 'Història: títol'
        required: false
        widget: string
      - name: historiaEnllac
        label: 'Història: enllaç a l''arxiu'
        widget: string
        required: false
      - name: somEtiqueta
        label: '«Som tots i totes»: etiqueta'
        required: false
        widget: string
      - name: somEtiqueta2
        label: '«Som tots i totes»: etiqueta de la dreta'
        required: false
        widget: string
      - name: somTitol
        label: '«Som tots i totes»: títol'
        required: false
        widget: string
      - name: nomsEtiqueta
        label: Títol de la llista de noms
        required: false
        widget: string
      - name: mostrarFinal
        label: Mostrar el bloc final
        required: false
        widget: boolean
      - name: finalTitol
        label: 'Bloc final: títol'
        required: false
        widget: string
      - name: finalBoto1
        label: 'Bloc final: botó 1'
        required: false
        widget: object
        fields:
        - name: text
          label: Text
          required: false
          widget: text
        - name: enllac
          label: Enllaç
          required: false
          widget: string
      - name: finalBoto2
        label: 'Bloc final: botó 2'
        required: false
        widget: object
        fields:
        - name: text
          label: Text
          required: false
          widget: text
        - name: enllac
          label: Enllaç
          required: false
          widget: string
    - name: engira
      label: Pàgina «En gira»
      file: src/data/textos/engira.json
      format: json
      fields:
      - name: titolPestanya
        label: Nom a la pestanya del navegador
        required: false
        widget: string
      - name: etiqueta
        label: Etiqueta petita (a sobre del títol)
        required: false
        widget: string
      - name: titol
        label: Títol gran
        required: false
        widget: string
      - name: presentacio
        label: Text d'introducció
        required: false
        widget: text
      - name: botoTotsDossiers
        label: Botó «Descarregar tots els dossiers»
        required: false
        widget: string
      - name: senseObres
        label: Text quan no hi ha cap obra en gira
        required: false
        widget: text
      - name: disponible
        label: Text «Disponible»
        required: false
        widget: string
      - name: botoVeure
        label: Botó per veure l'obra
        required: false
        widget: string
      - name: botoDossier
        label: Botó del dossier
        required: false
        widget: string
      - name: botoEntrades
        label: Botó de comprar entrades
        required: false
        widget: string
      - name: mostrarFinal
        label: Mostrar el bloc final
        required: false
        widget: boolean
      - name: finalTitol
        label: 'Bloc final: títol'
        required: false
        widget: string
      - name: finalText
        label: 'Bloc final: text'
        required: false
        widget: text
      - name: finalBoto
        label: 'Bloc final: botó'
        required: false
        widget: string
    - name: arxiu
      label: Pàgina «Temporades anteriors»
      file: src/data/textos/arxiu.json
      format: json
      fields:
      - name: titolPestanya
        label: Nom a la pestanya del navegador
        required: false
        widget: string
      - name: etiqueta
        label: Etiqueta petita (a sobre del títol)
        required: false
        widget: string
      - name: titol
        label: Títol gran
        required: false
        widget: string
      - name: presentacio
        label: Text d'introducció
        required: false
        widget: text
      - name: mostrarFiltre
        label: Mostrar el filtre per etiquetes
        required: false
        widget: boolean
      - name: filtra
        label: Paraula «Filtra»
        required: false
        widget: string
      - name: totes
        label: Text «Totes»
        required: false
        widget: string
      - name: mostrarAltres
        label: Mostrar «També vam fer» (altres actuacions)
        required: false
        widget: boolean
      - name: tambe
        label: Títol «També vam fer»
        required: false
        widget: string
      - name: representacio
        label: Paraula «representació» (singular)
        required: false
        widget: string
      - name: representacions
        label: Paraula «representacions»
        required: false
        widget: string
      - name: enGira
        label: Secció / etiqueta «En gira»
        required: false
        widget: string
    - name: obra
      label: Fitxa de cada obra (textos fixos)
      file: src/data/textos/obra.json
      format: json
      fields:
      - name: disponible
        label: Text «Disponible»
        required: false
        widget: string
      - name: estrena
        label: Paraula «Estrena»
        required: false
        widget: string
      - name: durada
        label: Etiqueta «Durada»
        required: false
        widget: string
      - name: public
        label: Etiqueta «Públic»
        required: false
        widget: string
      - name: format
        label: Etiqueta «Format»
        required: false
        widget: string
      - name: representacions
        label: Paraula «representacions»
        required: false
